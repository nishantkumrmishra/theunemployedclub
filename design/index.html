<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unemployed Club - Design Preview & Page Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=6.0">
  <style>
    /* Reset & Full Screen Edge-to-Edge Canvas */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-body, #f4f4f4);
      font-family: var(--font-sans, 'Manrope', sans-serif);
    }

    /* Website-Matching Design Navigation Header */
    .design-nav-header {
      height: var(--header-height, 56px);
      background: var(--bg-card, #ffffff);
      border-bottom: 1px solid var(--color-border, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 1000;
      box-sizing: border-box;
    }

    .design-nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .design-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-fg-bold, #111111);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .design-logo svg {
      color: var(--color-accent, #2ebaae);
      flex-shrink: 0;
    }

    .design-preview-tag {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--color-accent, #2ebaae);
      background: rgba(46, 186, 174, 0.08);
      border: 1px solid rgba(46, 186, 174, 0.3);
      padding: 3px 8px;
      letter-spacing: 0.03em;
    }

    /* Seamless Dropdown Menu for Switching Pages */
    .design-page-dropdown-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .design-dropdown-label {
      font-size: 0.8rem;
      color: var(--color-fg-light, #666666);
      font-weight: 500;
      white-space: nowrap;
    }

    .design-dropdown-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .design-page-select {
      appearance: none;
      -webkit-appearance: none;
      background: #fafafa;
      border: 1px solid var(--color-border, #e2e8f0);
      padding: 8px 36px 8px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-fg-bold, #111111);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
      min-width: 220px;
    }

    .design-page-select:hover,
    .design-page-select:focus {
      border-color: var(--color-accent, #2ebaae);
      background: #ffffff;
    }

    .design-dropdown-arrow {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: var(--color-fg-light, #666666);
      display: flex;
      align-items: center;
    }

    /* Header Actions */
    .design-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-design-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--color-fg, #333333);
      background: #fafafa;
      border: 1px solid var(--color-border, #e2e8f0);
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .btn-design-action:hover {
      border-color: var(--color-accent, #2ebaae);
      color: var(--color-accent, #2ebaae);
      background: #ffffff;
    }

    .btn-design-action svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* 100% Full-Screen Edge-to-Edge Frame (Zero Black Margins) */
    .design-full-frame-container {
      width: 100vw;
      height: calc(100vh - var(--header-height, 56px));
      margin: 0;
      padding: 0;
      border: none;
      overflow: hidden;
      display: block;
      background: var(--bg-body, #f4f4f4);
    }

    .design-full-iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- Website Design Navigation Header -->
  <header class="design-nav-header">
    <div class="design-nav-left">
      <a href="../index.html" class="design-logo" title="Back to Live Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
        <span>The Unemployed Club</span>
      </a>
      <span class="design-preview-tag">Design Switcher</span>
    </div>

    <!-- Dropdown Menu for Switching Different Pages -->
    <div class="design-page-dropdown-container">
      <label for="page-select" class="design-dropdown-label">Switch Page:</label>
      <div class="design-dropdown-wrapper">
        <select id="page-select" class="design-page-select" aria-label="Select website page to view">
          <option value="../index.html" selected>Home (index.html)</option>
          <option value="../shorts.html">Shorts (shorts.html)</option>
          <option value="../player.html">Video Player (player.html)</option>
          <option value="../admin.html">Admin Studio (admin.html)</option>
          <option value="../upload.html">Upload Video (upload.html)</option>
          <option value="../login.html">Sign In (login.html)</option>
          <option value="../register.html">Register (register.html)</option>
        </select>
        <div class="design-dropdown-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Right Header Actions -->
    <div class="design-header-actions">
      <button type="button" class="btn-design-action" id="btn-reload-page" title="Reload active page">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Reload</span>
      </button>

      <a href="../index.html" target="_blank" class="btn-design-action" id="btn-open-direct" title="Open active page in standalone new tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" x2="21" y1="14" y2="3"/>
        </svg>
        <span>Open Standalone</span>
      </a>
    </div>
  </header>

  <!-- Edge-to-Edge 100% Screen View (Zero Margins) -->
  <main class="design-full-frame-container">
    <iframe src="../index.html" class="design-full-iframe" id="design-iframe" title="Website Page Preview"></iframe>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('page-select');
      const iframe = document.getElementById('design-iframe');
      const openBtn = document.getElementById('btn-open-direct');
      const reloadBtn = document.getElementById('btn-reload-page');

      // Check URL query param for default page e.g. ?page=shorts
      const urlParams = new URLSearchParams(window.location.search);
      const queryPage = urlParams.get('page');
      if (queryPage) {
        const option = Array.from(select.options).find(opt => opt.value.includes(queryPage));
        if (option) {
          select.value = option.value;
          iframe.src = option.value;
          openBtn.href = option.value;
        }
      }

      // Handle Dropdown Change
      select.addEventListener('change', () => {
        const pageUrl = select.value;
        iframe.src = pageUrl;
        openBtn.href = pageUrl;

        // Cleanly update URL without full page reload
        try {
          const pageName = pageUrl.replace('../', '').replace('.html', '');
          const newUrl = new URL(window.location.href);
          newUrl.searchParams.set('page', pageName);
          window.history.replaceState({}, '', newUrl.toString());
        } catch (e) {}
      });

      // Handle Reload
      if (reloadBtn) {
        reloadBtn.addEventListener('click', () => {
          try {
            iframe.contentWindow.location.reload();
          } catch (e) {
            iframe.src = select.value;
          }
        });
      }
    });
  </script>
</body>
</html>
