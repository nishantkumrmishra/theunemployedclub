<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unemployed Club - Shorts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body class="page-shorts">
  <!-- Modular Zero-Build Header -->
  <site-header></site-header>

  <div id="wrapper">
    <!-- Modular Zero-Build Sidebar -->
    <site-sidebar active="shorts"></site-sidebar>

    <!-- Main Content Area: 3-Box Shorts Stage (Exact Layout & Sizing from User Annotated Screenshot) -->
    <main id="main-content" class="shorts-main-content">
      <div class="shorts-stage" id="shorts-stage">

        <!-- 1. Left Box: Video Title & Description Only (Sits at Bottom-Left, Width ~350px, Height ~220px) -->
        <aside class="shorts-info-panel" id="shorts-info-panel">
          <h2 class="shorts-info-title" id="shorts-info-title">
            Everyday minimalism in editorial design
          </h2>
          <div class="shorts-info-desc" id="shorts-info-desc">
            High fidelity editorial curation • Pacing, typography, and pure brutalist aesthetic with zero compression degradation.
          </div>
        </aside>

        <!-- 2. Middle Box: Tall 9:16 Video Player with Translucent Dynamic Actions & Bottom Hover Scrubber -->
        <div class="shorts-center-container">
          <div class="shorts-screen-box" id="shorts-box" style="cursor: pointer;">
            <!-- Video element ready for CDN stream or local loop -->
            <video id="shorts-video" class="shorts-video-element" poster="images/pic03.jpg" playsinline loop preload="metadata" muted>
              Your browser does not support HTML5 video playback.
            </video>

            <!-- Click to play/pause overlay -->
            <div class="shorts-overlay-play" id="shorts-play-overlay">
              <button class="shorts-screen-play-btn" id="shorts-screen-play-btn" aria-label="Play Short">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="6 3 20 12 6 21 6 3"/>
                </svg>
              </button>
            </div>

            <!-- Vertical Action Toolbar on the Right Edge of Video (Translucent Frosted Glass) -->
            <div class="shorts-actions-column">
              <!-- Like -->
              <div class="shorts-action-item">
                <button class="shorts-action-btn" id="btn-short-like" aria-label="Like Short">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 10v12"/>
                    <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h3"/>
                    <path d="M14 10V4.5a2.5 2.5 0 0 0-5 0v1.5"/>
                  </svg>
                </button>
                <span class="shorts-action-count" id="shorts-like-count">42K</span>
              </div>

              <!-- Dislike -->
              <div class="shorts-action-item">
                <button class="shorts-action-btn" id="btn-short-dislike" aria-label="Dislike Short">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 14V2"/>
                    <path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3"/>
                    <path d="M10 14v5.5a2.5 2.5 0 0 0 5 0V18"/>
                  </svg>
                </button>
                <span class="shorts-action-count">Dislike</span>
              </div>

              <!-- Comment Button -->
              <div class="shorts-action-item">
                <button class="shorts-action-btn" id="btn-short-comment" aria-label="Open Comments">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                </button>
                <span class="shorts-action-count" id="shorts-comment-count">0</span>
              </div>

              <!-- Share Button -->
              <div class="shorts-action-item">
                <button class="shorts-action-btn" id="btn-short-share" aria-label="Share Short">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                  </svg>
                </button>
                <span class="shorts-action-count">Share</span>
              </div>

              <!-- Volume Control Button with Flyout Slider -->
              <div class="shorts-action-item shorts-volume-container" id="shorts-volume-wrapper">
                <button class="shorts-action-btn" id="btn-short-volume" aria-label="Mute / Unmute Short">
                  <svg id="shorts-vol-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
                    <line x1="22" x2="16" y1="9" y2="15"/>
                    <line x1="16" x2="22" y1="9" y2="15"/>
                  </svg>
                </button>
                <div class="shorts-volume-slider-box" id="shorts-volume-slider-box">
                  <input type="range" class="shorts-vol-slider" id="shorts-volume-slider" min="0" max="1" step="0.02" value="0.8" aria-label="Volume level" />
                  <span class="shorts-vol-pct" id="shorts-vol-pct">80%</span>
                </div>
              </div>

              <!-- Prev/Next Up/Down Navigation Arrows -->
              <div class="shorts-nav-arrows">
                <button class="btn-short-arrow" id="btn-short-prev" aria-label="Previous Short" title="Previous Short (Up Arrow / Scroll Up)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 15-6-6-6 6"/>
                  </svg>
                </button>
                <button class="btn-short-arrow" id="btn-short-next" aria-label="Next Short" title="Next Short (Down Arrow / Scroll Down)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Bottom Hover Controls: Scrubber Timeline Bar (Only shows when user hovered) -->
            <div class="shorts-hover-controls" id="shorts-hover-controls">
              <div class="shorts-scrubber-track" id="shorts-scrubber-track" role="slider" aria-label="Seek video">
                <div class="shorts-scrubber-buffered" id="shorts-scrubber-buffered"></div>
                <div class="shorts-scrubber-fill" id="shorts-scrubber-fill"></div>
                <div class="shorts-scrubber-handle" id="shorts-scrubber-handle"></div>
              </div>
              <div class="shorts-hover-controls-row">
                <div class="shorts-hover-left">
                  <button type="button" class="shorts-mini-ctrl-btn" id="shorts-mini-play-btn" aria-label="Toggle Play">
                    <svg id="shorts-mini-play-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                  </button>
                  <div class="shorts-time-display">
                    <span id="shorts-current-time">0:00</span> / <span id="shorts-duration">0:00</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Slim persistent bottom progress line (when not hovering) -->
            <div class="shorts-timeline-progress" id="shorts-timeline-progress">
              <div class="shorts-progress-bar" id="shorts-progress-bar"></div>
            </div>
          </div>
        </div>

        <!-- 3. Right Box: Comments & Up Next Queue (Sits at Bottom-Right, Width ~560px, Height ~320px) -->
        <aside class="shorts-companion-panel" id="shorts-companion-panel">
          <div class="shorts-tabs-header">
            <button class="shorts-tab-btn is-active" id="tab-btn-comments" data-tab="comments">
              Comments (0)
            </button>
            <button class="shorts-tab-btn" id="tab-btn-queue" data-tab="queue">
              Up Next (5)
            </button>
          </div>

          <!-- Tab 1: Comments -->
          <div class="shorts-tab-content is-active" id="tab-content-comments">
            <!-- Under Construction Notice -->
            <div class="comment-construction-notice" id="comment-notice">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span>Community comments are currently under construction. Live discussions are launching soon.</span>
            </div>

            <div class="shorts-comment-input-row">
              <img src="images/avatar.jpg" alt="User Avatar" class="comment-author-avatar" />
              <div class="comment-input-box">
                <input type="text" id="new-comment-input" placeholder="Comments under construction..." />
                <button class="btn-post-comment" id="btn-post-comment">Post</button>
              </div>
            </div>
            <ul class="shorts-comments-list" id="comments-list"></ul>
          </div>

          <!-- Tab 2: Up Next Queue -->
          <div class="shorts-tab-content" id="tab-content-queue">
            <ul class="shorts-queue-list" id="shorts-queue-list"></ul>
          </div>
        </aside>

      </div>
    </main>
  </div>

  <script src="js/catalog-feed.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/shorts.js"></script>
</body>
</html>
