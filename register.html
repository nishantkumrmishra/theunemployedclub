<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - The Unemployed Club</title>
  <!-- Google Fonts: Manrope Thin -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/components.js"></script>
</head>
<body>
  <!-- Modular Zero-Build Header -->
  <site-header></site-header>

  <div id="wrapper">
    <!-- Modular Zero-Build Sidebar -->
    <site-sidebar></site-sidebar>

    <!-- Main Auth Area -->
    <main id="main-content">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Join The Unemployed Club today</p>
        </div>

        <form class="auth-form" id="register-form" onsubmit="event.preventDefault(); alert('Account registered successfully! Please sign in.'); window.location.href='login.html';">
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="johndoe" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" placeholder="name@example.com" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="••••••••" required autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" placeholder="••••••••" required autocomplete="new-password" />
          </div>

          <button type="submit" class="btn-auth-submit">Create Account</button>
        </form>

        <div class="auth-footer">
          <span>Already have an account?</span>
          <a href="login.html">Sign In</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
